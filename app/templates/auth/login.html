{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
  <h1>Log in</h1>

  {% if registered %}
    <div class="notice">Account created. Please log in.</div>
  {% endif %}

  <form method="post" action="/login" class="card form">
    {% include "_form_errors.html" %}

    <label>Mobile number
      <input name="phone" value="{{ phone }}" inputmode="numeric" maxlength="10" autocomplete="username" required>
    </label>

    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>

    <button type="submit">Log in</button>
  </form>

  <p>New here? <a href="/register">Create an account</a></p>
{% endblock %}
